  KMSUpdateFunctionRole:
    Type: AWS::IAM::Role
    Condition: CreateOwnKMSUpdateFunctionRole
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: kms-update-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt KMSUpdateFunctionLogGroup.Arn
        - !If
          - UseKmsUpdateKeyPolicy
          - PolicyName: kms-update-key-policy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - kms:DescribeKey
                    - kms:GetKeyPolicy
                    - kms:PutKeyPolicy
                  Resource: !Ref ExistingKmsKeyIdOrArn
          - !Ref AWS::NoValue

  KMSUpdateFunctionLogGroup:
    Type: "AWS::Logs::LogGroup"
    Condition: CreateKMSUpdate
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/s3-rollback/${AWS::StackName}/${StackUuid}/KMSUpdateFunction"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  KMSUpdateFunction:
    Type: AWS::Lambda::Function
    Condition: CreateKMSUpdate
    Properties:
      LoggingConfig:
        LogGroup: !Ref KMSUpdateFunctionLogGroup
      Runtime: python3.13
      Handler: index.handler
      Role: !If [UseSharedIAMRole, !Ref SharedIAMRoleArn, !GetAtt KMSUpdateFunctionRole.Arn]
      Timeout: 180
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3
          import traceback
          from botocore.exceptions import ClientError

          kms = boto3.client("kms")

          PERMISSIONS_URL = "https://github.com/aws-solutions-library-samples/guidance-for-rolling-back-changes-to-datasets-in-amazon-s3/blob/main/permissions.md"

          def _send_response(event, context, status, data, physical_resource_id=None, reason=None):
              response_url = event["ResponseURL"]
              body = {
                  "Status": status,
                  "Reason": reason or f"See CloudWatch Log Stream: {context.log_stream_name}",
                  "PhysicalResourceId": physical_resource_id or context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data or {}
              }
              json_body = json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  response_url,
                  data=json_body,
                  method="PUT",
                  headers={"content-type": "", "content-length": str(len(json_body))}
              )
              with urllib.request.urlopen(req) as resp:
                  resp.read()

          def _safe_sid(event):
              # Deterministic SID per stack + logical id, sanitized.
              raw = f"{event.get('StackId','')}-{event.get('LogicalResourceId','')}"
              safe = []
              for ch in raw:
                  if ch.isalnum():
                      safe.append(ch)
                  else:
                      safe.append("_")
              sid = "AllowPrincipalUseOfKey_" + "".join(safe)
              return sid[:200]

          def _load_policy(key_id, policy_name):
              resp = kms.get_key_policy(KeyId=key_id, PolicyName=policy_name)
              policy_str = resp["Policy"]
              policy = json.loads(policy_str)
              if "Statement" not in policy or policy["Statement"] is None:
                  policy["Statement"] = []
              if not isinstance(policy["Statement"], list):
                  policy["Statement"] = [policy["Statement"]]
              if "Version" not in policy:
                  policy["Version"] = "2012-10-17"
              return policy

          import re
          _ROLE_ID_RE = re.compile(r'^AROA[A-Z0-9]+$')

          def _scrub_stale_principals(policy):
              # When an IAM role is deleted, KMS replaces its ARN with the raw role ID
              # (e.g. AROA123456789EXAMPLE) in the key policy. PutKeyPolicy rejects any
              # policy that contains these orphaned IDs with MalformedPolicyDocumentException.
              # This function removes such statements so subsequent PutKeyPolicy calls succeed.
              clean = []
              for st in policy.get("Statement", []):
                  principal = st.get("Principal", {})
                  aws = principal.get("AWS") if isinstance(principal, dict) else None
                  if aws is None:
                      clean.append(st)
                      continue
                  arns = aws if isinstance(aws, list) else [aws]
                  valid = [a for a in arns if not _ROLE_ID_RE.match(a)]
                  if not valid:
                      print(f"Dropping stale KMS statement (Sid={st.get('Sid')!r}) "
                            f"with deleted principal(s): {arns}")
                      continue
                  if len(valid) < len(arns):
                      removed = [a for a in arns if _ROLE_ID_RE.match(a)]
                      print(f"Removing stale principal(s) {removed} from statement Sid={st.get('Sid')!r}")
                      st = dict(st)
                      st["Principal"] = dict(st["Principal"])
                      st["Principal"]["AWS"] = valid[0] if len(valid) == 1 else valid
                  clean.append(st)
              policy["Statement"] = clean
              return policy

          def _put_policy(key_id, policy_name, policy):
              import time
              # Retry on MalformedPolicyDocumentException — this can occur when a newly
              # created IAM role hasn't fully propagated before KMS validates the principal.
              for attempt in range(8):
                  try:
                      kms.put_key_policy(
                          KeyId=key_id,
                          PolicyName=policy_name,
                          Policy=json.dumps(policy)
                      )
                      return
                  except kms.exceptions.MalformedPolicyDocumentException:
                      if attempt == 7:
                          raise
                      wait = 2 ** attempt  # 1, 2, 4, 8, 16, 32, 64s
                      print(f"MalformedPolicyDocumentException on attempt {attempt+1}, "
                            f"retrying in {wait}s (IAM propagation delay) ...")
                      time.sleep(wait)

          def _ensure_statement(policy, sid, principal_arn):
              # Remove any existing statement with the same Sid, then re-add desired statement.
              new_statements = []
              for st in policy.get("Statement", []):
                  if isinstance(st, dict) and st.get("Sid") == sid:
                      continue
                  new_statements.append(st)

              allow_stmt = {
                  "Sid": sid,
                  "Effect": "Allow",
                  "Principal": {"AWS": principal_arn},
                  "Action": [
                      "kms:Decrypt",
                      "kms:GenerateDataKey",
                      "kms:DescribeKey"
                  ],
                  "Resource": "*"
              }
              new_statements.append(allow_stmt)
              policy["Statement"] = new_statements
              return policy

          def _remove_statement(policy, sid):
              statements = policy.get("Statement", [])
              new_statements = []
              removed = False
              for st in statements:
                  if isinstance(st, dict) and st.get("Sid") == sid:
                      removed = True
                      continue
                  new_statements.append(st)
              policy["Statement"] = new_statements
              return policy, removed

          def _error_code(e):
              return e.response.get("Error", {}).get("Code", "")

          def _role_can_use_key(key_id):
              # DryRun checks authorization without generating a key. KMS reports
              # DryRunOperationException when the call would have succeeded.
              try:
                  kms.generate_data_key(KeyId=key_id, KeySpec="AES_256", DryRun=True)
              except ClientError as e:
                  if _error_code(e) == "DryRunOperationException":
                      return True, ""
                  return False, f"{_error_code(e)}: {e.response.get('Error', {}).get('Message', '')}"
              except Exception as e:
                  return False, str(e)
              return False, "GenerateDataKey DryRun did not report DryRunOperationException"

          def _key_policy_reason(key_id, principal_arn, error, detail):
              statement = {
                  "Sid": "AllowS3RollbackRole",
                  "Effect": "Allow",
                  "Principal": {"AWS": principal_arn},
                  "Action": ["kms:Decrypt", "kms:GenerateDataKey", "kms:DescribeKey"],
                  "Resource": "*"
              }
              return (
                  f"Role {principal_arn} cannot update the policy of KMS key {key_id} "
                  f"({_error_code(error)}) and cannot use the key ({detail}). "
                  f"Add this statement to the key policy, or allow the role kms:GetKeyPolicy "
                  f"and kms:PutKeyPolicy on the key: {json.dumps(statement)} See {PERMISSIONS_URL}"
              )

          def handler(event, context):
              physical_id = event.get("PhysicalResourceId") or f"{event['StackId']}/{event['LogicalResourceId']}"
              try:
                  props = event.get("ResourceProperties", {})
                  key_id = props["KeyId"]
                  policy_name = props.get("PolicyName", "default")
                  principal_arn = props["PrincipalArn"]
                  sid = props.get("StatementSid") or _safe_sid(event)

                  request_type = event["RequestType"]

                  if request_type in ["Create", "Update"]:
                      try:
                          policy = _load_policy(key_id, policy_name)
                          policy = _scrub_stale_principals(policy)
                          policy = _ensure_statement(policy, sid, principal_arn)
                          _put_policy(key_id, policy_name, policy)
                      except ClientError as e:
                          if props.get("SharedRoleMode") != "YES" or _error_code(e) != "AccessDeniedException":
                              raise
                          # A pre-created role may be allowed to use the key without being
                          # allowed to edit its policy. Check without changing anything.
                          print(f"Cannot update key policy as {principal_arn}: {e}. Checking key access with a dry run.")
                          can_use, detail = _role_can_use_key(key_id)
                          if can_use:
                              _send_response(
                                  event, context, "SUCCESS",
                                  data={"StatementSid": sid, "PrincipalArn": principal_arn,
                                        "KeyPolicyManagedByCustomer": "true"},
                                  physical_resource_id=physical_id
                              )
                              return
                          _send_response(
                              event, context, "FAILED", data={},
                              physical_resource_id=physical_id,
                              reason=_key_policy_reason(key_id, principal_arn, e, detail)
                          )
                          return

                      _send_response(
                          event, context, "SUCCESS",
                          data={"StatementSid": sid, "PrincipalArn": principal_arn},
                          physical_resource_id=physical_id
                      )
                      return

                  if request_type == "Delete":
                      # Best effort cleanup — if the execution role no longer exists
                      # (e.g. orchestrator stack deleted before child stack cleanup
                      # completed), skip silently. The stale statement will be scrubbed
                      # by _scrub_stale_principals on the next KMS policy update.
                      try:
                          policy = _load_policy(key_id, policy_name)
                          policy = _scrub_stale_principals(policy)
                          policy, removed = _remove_statement(policy, sid)
                          if removed:
                              _put_policy(key_id, policy_name, policy)
                      except Exception as e:
                          print(f"Warning: KMS policy cleanup skipped: {e}")
                          removed = False

                      _send_response(
                          event, context, "SUCCESS",
                          data={"StatementSid": sid, "Removed": str(removed)},
                          physical_resource_id=physical_id
                      )
                      return

                  _send_response(event, context, "FAILED", data={}, physical_resource_id=physical_id, reason="Unknown RequestType")

              except Exception as e:
                  tb = traceback.format_exc()
                  _send_response(
                      event, context, "FAILED",
                      data={"Error": str(e)},
                      physical_resource_id=physical_id,
                      reason=tb[:1024]
                  )



  KMSUpdate:
    Condition: CreateKMSUpdate
    Type: Custom::KMSUpdate
    Properties:
      ServiceTimeout: 180
      ServiceToken: !GetAtt KMSUpdateFunction.Arn
      KeyId: !Ref ExistingKmsKeyIdOrArn
      PrincipalArn: !If [UseSharedIAMRole, !Ref SharedIAMRoleArn, !GetAtt MetadataFinderRole.Arn]
      SharedRoleMode: !If [UseSharedIAMRole, "YES", "NO"]

  # Grant the QueryExecutorRole KMS access to the metadata table key so Athena
  # can decrypt the KMS-encrypted S3 Metadata tables during query execution.
  # Only needed in own-roles mode — in shared-role mode KMSUpdate covers both.
  KMSUpdateQueryExecutor:
    Condition: CreateOwnKMSUpdateFunctionRole
    Type: Custom::KMSUpdate
    Properties:
      ServiceTimeout: 180
      ServiceToken: !GetAtt KMSUpdateFunction.Arn
      KeyId: !Ref ExistingKmsKeyIdOrArn
      PrincipalArn: !GetAtt QueryExecutorRole.Arn
      # Only exists with per-stack roles, so never shared-role mode.
      SharedRoleMode: "NO"


