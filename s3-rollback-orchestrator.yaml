        EnforceWorkGroupConfiguration: false

  CsvParserFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/s3-rollback/${AWS::StackName}/${StackUuid}/CsvParserFunction"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  CsvParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-csv-parser"
      LoggingConfig:
        LogGroup: !Ref CsvParserFunctionLogGroup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, !GetAtt LambdaExecutionRole.Arn]
      Environment:
        Variables:
          # Stagger settings (hardcoded, not CFN parameters — avoids cluttering
          # the console). The parser assigns each row a StaggerSeconds value
          # based on its position (index % MAX_CONCURRENCY), so that when the
          # Distributed Map launches rows in waves of up to MAX_CONCURRENCY, the
          # first STAGGER_BATCH_SIZE rows start immediately, the next batch
          # after STAGGER_INTERVAL_SECONDS, and so on. This spreads CreateStack
          # calls over time to avoid thundering-herd pressure on LF / KMS /
          # Athena during the early phase of each child stack.
          MAX_CONCURRENCY: "50"
          STAGGER_BATCH_SIZE: "5"
          STAGGER_INTERVAL_SECONDS: "15"
          # WorkGroup pool — must match the 10 AthenaWorkGroup* resources above.
          # Each row is assigned wg-<index % WORKGROUP_POOL_SIZE>.
          WORKGROUP_POOL_SIZE: "10"
          WORKGROUP_NAME_PREFIX: !Sub "${AWS::StackName}-wg-"
          # Supplied-role mode only: the role to check is a Lake Formation admin before any
          # child stack is created. Passed explicitly because sts:GetCallerIdentity returns the
          # assumed-role ARN, which drops the role's path.
          LF_CHECK_ROLE_ARN: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, ""]
          ACCOUNT_ID: !Ref AWS::AccountId
      Code:
        ZipFile: |
          import boto3
          import csv
          import io
          import os
          import re
          from botocore.exceptions import ClientError

          s3 = boto3.client('s3')
          lf = boto3.client('lakeformation')
          glue = boto3.client('glue')

          LF_CHECK_ROLE_ARN = os.environ.get('LF_CHECK_ROLE_ARN', '')
          ACCOUNT_ID = os.environ.get('ACCOUNT_ID', '')
          PERMISSIONS_URL = ("https://github.com/aws-solutions-library-samples/"
                             "guidance-for-rolling-back-changes-to-datasets-in-amazon-s3/blob/main/permissions.md")

          BUCKET_NAME_RE = re.compile(r'^[a-z0-9][a-z0-9.\-]{1,61}[a-z0-9]$')

          # Stagger knobs — env-driven so they can be tuned without editing the
          # state machine definition. See the environment block above for intent.
          MAX_CONCURRENCY = int(os.environ.get('MAX_CONCURRENCY', '10'))
          STAGGER_BATCH_SIZE = int(os.environ.get('STAGGER_BATCH_SIZE', '2'))
          STAGGER_INTERVAL_SECONDS = int(os.environ.get('STAGGER_INTERVAL_SECONDS', '30'))

          # WorkGroup pool — each row is assigned a WorkGroup by index so the
          # total number of WorkGroups stays fixed regardless of row count.
          WORKGROUP_POOL_SIZE = int(os.environ.get('WORKGROUP_POOL_SIZE', '10'))
          WORKGROUP_NAME_PREFIX = os.environ.get('WORKGROUP_NAME_PREFIX', '')

          def compute_stagger_seconds(row_index):
              """
              Stagger each row's start so no more than STAGGER_BATCH_SIZE rows
              enter CreateStack in the same wave. Modulo MAX_CONCURRENCY keeps
              the max wait bounded (doesn't scale with total row count) — this
              matters because Distributed Map launches replacement executions
              as in-flight children complete, and we want those replacements
              spread too.

              Example with MAX_CONCURRENCY=50, STAGGER_BATCH_SIZE=5, INTERVAL=15:
                rows  0–4 -> 0s    5–9 -> 15s   10–14 -> 30s  ...  45–49 -> 135s
                rows 50–54-> 0s   ... (repeats every 50 rows)
              """
              if STAGGER_BATCH_SIZE <= 0 or STAGGER_INTERVAL_SECONDS <= 0:
                  return 0
              return ((row_index % MAX_CONCURRENCY) // STAGGER_BATCH_SIZE) * STAGGER_INTERVAL_SECONDS

          def compute_workgroup_name(row_index):
              """
              Assign a WorkGroup from the fixed pool by index so the total
              WorkGroup count stays at WORKGROUP_POOL_SIZE regardless of how
              many rows are processed.
              """
              if not WORKGROUP_NAME_PREFIX:
                  return ''
              return f'{WORKGROUP_NAME_PREFIX}{row_index % WORKGROUP_POOL_SIZE}'

          def parse_s3_url(url):
              url = url.strip()
              if url.startswith('s3://'):
                  path = url[5:]
                  parts = path.split('/', 1)
                  if len(parts) != 2 or not parts[1]:
                      raise ValueError(f"Invalid S3 URL (missing key): {url}")
                  return parts[0], parts[1]
              elif url.startswith('https://'):
                  from urllib.parse import urlparse
                  parsed = urlparse(url)
                  host = parsed.hostname or ''
                  path = parsed.path.lstrip('/')
                  if '.s3.' in host or host.endswith('.s3.amazonaws.com'):
                      bucket = host.split('.s3.')[0] if '.s3.' in host else host.split('.s3.amazonaws.com')[0]
                      return bucket, path
                  elif host.startswith('s3.') or host.startswith('s3-'):
                      parts = path.split('/', 1)
                      if len(parts) != 2:
                          raise ValueError(f"Invalid S3 HTTPS URL (missing key): {url}")
                      return parts[0], parts[1]
                  else:
                      raise ValueError(f"Unrecognized S3 HTTPS URL format: {url}")
              else:
                  raise ValueError(f"Invalid S3 URL: {url}")

          # Same rule as LFPermissionsGranter.detect_mode in s3-rollback.yaml; keep them identical.
          def detect_mode(settings):
              principals = [
                  p["Principal"]["DataLakePrincipalIdentifier"]
                  for p in settings.get("CreateTableDefaultPermissions", [])
                  if p.get("Principal")
              ]
              if "IAM_ALLOWED_PRINCIPALS" in principals:
                  return "IAM_Mode"
              return "LF_Mode"

          def region():
              return os.environ.get("AWS_REGION", "")

          def access_error(what, permission, err):
              return RuntimeError(
                  f"The role {LF_CHECK_ROLE_ARN} cannot read {what} to check whether Lake Formation "
                  f"manages it: {err}. Grant the role {permission}. See {PERMISSIONS_URL}")

          def s3tables_catalog_mode():
              """LF mode of s3tablescatalog/aws-s3. A missing catalog is not in LF mode: accounts
              using S3 Inventory or a CSV inventory may have no S3 Tables integration."""
              catalog_id = f"{ACCOUNT_ID}:s3tablescatalog/aws-s3"
              try:
                  catalog = glue.get_catalog(CatalogId=catalog_id).get("Catalog", {})
              except ClientError as e:
                  code = e.response.get("Error", {}).get("Code", "")
                  if code == "EntityNotFoundException":
                      return "IAM_Mode"
                  if code == "AccessDeniedException":
                      # In LF mode, LF itself denies GetCatalog to a non-admin without DESCRIBE
                      # ("Insufficient Lake Formation permission(s)"), which shows LF manages it.
                      if "Lake Formation" in e.response.get("Error", {}).get("Message", ""):
                          return "LF_Mode"
                      raise access_error("s3tablescatalog/aws-s3", "glue:GetCatalog on it", e) from e
                  raise
              return detect_mode({"CreateTableDefaultPermissions":
                                  catalog.get("CreateTableDefaultPermissions", [])})

          def check_lf_admin():
              """Supplied-role mode: fail before any child stack exists if Lake Formation manages a
              catalog and the supplied orchestrator Lambda role is not a data lake admin. Child
              stacks create their Glue database and make their LF grants as this role."""
              if not LF_CHECK_ROLE_ARN:
                  return
              try:
                  settings = lf.get_data_lake_settings(CatalogId=ACCOUNT_ID)["DataLakeSettings"]
              except ClientError as e:
                  if e.response.get("Error", {}).get("Code", "") == "AccessDeniedException":
                      raise access_error("the Lake Formation settings",
                                         "lakeformation:GetDataLakeSettings", e) from e
                  raise
              admins = [a.get("DataLakePrincipalIdentifier")
                        for a in settings.get("DataLakeAdmins", [])]
              if LF_CHECK_ROLE_ARN in admins:
                  return
              lf_catalogs = []
              if detect_mode(settings) == "LF_Mode":
                  lf_catalogs.append("the account catalog")
              if s3tables_catalog_mode() == "LF_Mode":
                  lf_catalogs.append("s3tablescatalog/aws-s3")
              if not lf_catalogs:
                  return
              raise RuntimeError(
                  f"Lake Formation manages permissions on {' and '.join(lf_catalogs)}, and the role "
                  f"{LF_CHECK_ROLE_ARN} (OrchestratorLambdaRoleArn) is not a Lake Formation data lake "
                  f"administrator in {region()}. Child stacks create their Glue databases and make "
                  f"their Lake Formation grants as this role. Make it a data lake administrator in "
                  f"{region()}, then start the orchestrator again. No child stacks were created. "
                  f"See {PERMISSIONS_URL}")

          def handler(event, context):
              check_lf_admin()
              s3_url = event['S3CsvUrl']
              bucket, key = parse_s3_url(s3_url)

              response = s3.get_object(Bucket=bucket, Key=key)
              body = response['Body'].read().decode('utf-8')

              reader = csv.reader(io.StringIO(body))
              rows = list(reader)

              if not rows:
                  return []

              first_val = rows[0][0].strip() if rows[0] else ''
              if first_val and not BUCKET_NAME_RE.match(first_val):
                  data_rows = rows[1:]
                  row_offset = 2
              else:
                  data_rows = rows
                  row_offset = 1

              results = []
              seen_buckets = set()
              # Output index (monotonically increasing across valid rows) drives
              # the stagger offset. Skipped rows don't consume a slot because
              # their child execution just passes through with no CreateStack.
              valid_index = 0

              for i, row in enumerate(data_rows):
                  row_num = i + row_offset
                  bucket_name = row[0].strip() if row else ''

                  if not bucket_name:
                      results.append({
                          'BucketName': '',
                          'Prefix': '',
                          'KmsKey': row[2].strip() if len(row) > 2 else '',
                          'Status': 'SKIPPED',
                          'Error': f'Row {row_num}: Missing required Bucket Name',
                          'StaggerSeconds': 0
                      })
                      continue

                  raw_prefix = row[1].strip() if len(row) > 1 else ''
                  kms_key = row[2].strip() if len(row) > 2 else ''

                  if not BUCKET_NAME_RE.match(bucket_name):
                      results.append({
                          'BucketName': bucket_name,
                          'Prefix': raw_prefix,
                          'KmsKey': kms_key,
                          'Status': 'SKIPPED',
                          'Error': f'Row {row_num}: Invalid bucket name format: {bucket_name}',
                          'StaggerSeconds': 0
                      })
                      continue

                  # Support comma-separated prefixes: split into individual entries
                  # so each prefix gets its own child stack. A single prefix (or empty)
                  # produces a one-element list, preserving existing behavior.
                  prefixes = [p.strip() for p in raw_prefix.split(',') if p.strip()] if raw_prefix else ['']

                  for prefix in prefixes:
                      dedup_key = f'{bucket_name}/{prefix}'
                      if dedup_key in seen_buckets:
                          results.append({
                              'BucketName': bucket_name,
                              'Prefix': prefix,
                              'KmsKey': kms_key,
                              'Status': 'SKIPPED',
                              'Error': f'Row {row_num}: Duplicate bucket/prefix: {dedup_key} (first seen earlier)',
                              'StaggerSeconds': 0
                          })
                          continue

                      seen_buckets.add(dedup_key)
                      results.append({
                          'BucketName': bucket_name,
                          'Prefix': prefix,
                          'KmsKey': kms_key,
                          'StaggerSeconds': compute_stagger_seconds(valid_index),
                          'WorkGroupName': compute_workgroup_name(valid_index)
                      })
                      valid_index += 1

              return results

  StackManagerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/s3-rollback/${AWS::StackName}/${StackUuid}/StackManagerFunction"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  StackManagerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-stack-manager"
      LoggingConfig:
        LogGroup: !Ref StackManagerFunctionLogGroup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, !GetAtt LambdaExecutionRole.Arn]
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          START_S3_BATCH_OPS_JOBS: !Ref StartS3BatchOperationsJobs
          TEMPLATE_URL: !Ref TemplateS3Url
          SHARED_IAM_ROLE_ARN: !If [HasExistingSharedRole, !Ref SharedIAMRoleArn, !If [ShouldCreateSharedRole, !GetAtt ChildStackExecutionRole.Arn, ""]]
          TIMESTAMP: !Ref TimeStamp
          MODE: !Ref Mode
          ORCHESTRATOR_STACK_ID: !Ref AWS::StackId
          LF_ADMIN_ROLE_ARN: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, !GetAtt LambdaExecutionRole.Arn]
      Code:
        ZipFile: |
          import boto3
          import os
          import time
          from botocore.exceptions import ClientError

          cfn = boto3.client('cloudformation')
          s3 = boto3.client('s3')

          RESULTS_BUCKET = os.environ['RESULTS_BUCKET']
          START_S3_BATCH_OPS_JOBS = os.environ['START_S3_BATCH_OPS_JOBS']
          TEMPLATE_URL = os.environ['TEMPLATE_URL']
          SHARED_IAM_ROLE_ARN = os.environ.get('SHARED_IAM_ROLE_ARN', '')
          TIMESTAMP = os.environ['TIMESTAMP']
          MODE = os.environ['MODE']
          ORCHESTRATOR_STACK_ID = os.environ['ORCHESTRATOR_STACK_ID']
          LF_ADMIN_ROLE_ARN = os.environ['LF_ADMIN_ROLE_ARN']

          # Tag applied to every child stack this orchestrator creates. Used by
          # find_existing_stack to scope dedup to stacks owned by *this* orchestrator
          # deployment — so a leftover stack from a prior run, or a stack from a
          # parallel orchestrator deployment, is never treated as a duplicate.
          ORCHESTRATOR_TAG_KEY = 'S3RollbackOrchestratorStackId'

          THROTTLE_CODES = ('Throttling', 'RequestThrottled', 'TooManyRequestsException')

          def cfn_call(func, **kwargs):
              """Call a CFN API with exponential backoff on throttling (up to 8 attempts).

              Raises the original ClientError if every attempt is throttled, so callers
              never receive None.
              """
              last_exc = None
              for attempt in range(8):
                  try:
                      return func(**kwargs)
                  except ClientError as e:
                      code = e.response['Error'].get('Code', '')
                      if code not in THROTTLE_CODES:
                          raise
                      last_exc = e
                      if attempt < 7:
                          delay = min(2 ** attempt + attempt, 60)
                          print(f"Throttled ({code}), retry {attempt+1} in {delay}s")
                          time.sleep(delay)
              raise last_exc

          def generate_stack_name(bucket_name, prefix=''):
              suffix = os.urandom(3).hex()
              safe_bucket = bucket_name.replace('.', '-')
              if prefix:
                  # Sanitise prefix: replace non-alphanumeric runs with '-', strip trailing '-'
                  import re
                  safe_prefix = re.sub(r'[^a-zA-Z0-9]+', '-', prefix).strip('-')
              else:
                  safe_prefix = ''
              # Budget: 's3-rollback-' (12) + '-' (1) + '-' (1) + suffix (6) = 20 fixed chars
              # Remaining 108 chars split between bucket and prefix slug
              if safe_prefix:
                  # Reserve up to 40 chars for the prefix slug; bucket gets the rest
                  prefix_part = safe_prefix[:40].rstrip('-')
                  bucket_part = safe_bucket[:67]
                  return f's3-rollback-{bucket_part}-{prefix_part}-{suffix}'
              else:
                  bucket_part = safe_bucket[:108]
                  return f's3-rollback-{bucket_part}-{suffix}'

          def check_bucket_exists(bucket_name):
              try:
                  s3.head_bucket(Bucket=bucket_name)
                  return True
              except ClientError as e:
                  code = int(e.response['ResponseMetadata']['HTTPStatusCode'])
                  if code == 404:
                      return False
                  return True
              except Exception:
                  return True

          def find_existing_stack(bucket_name, prefix=''):
              """
              Return an active child stack for this bucket/prefix that was created
              by THIS orchestrator deployment, or None.

              Matching dimensions:
                - bucket name (via stack name prefix)
                - Prefix parameter
                - S3RollbackOrchestratorStackId tag equals this orchestrator's stack ID

              The tag match is what scopes dedup to the current orchestrator run.
              Without it, a leftover child stack from a previous run or a stack
              created by a parallel orchestrator deployment would be treated as a
              duplicate and the Lambda would return EXISTING — producing a silent
              no-op while reporting SUCCEEDED.
              """
              safe_bucket = bucket_name.replace('.', '-')
              name_prefix = f's3-rollback-{safe_bucket}-'
              active_statuses = [
                  'CREATE_IN_PROGRESS', 'CREATE_COMPLETE',
                  'UPDATE_IN_PROGRESS', 'UPDATE_COMPLETE',
                  'REVIEW_IN_PROGRESS'
              ]
              try:
                  paginator = cfn.get_paginator('list_stacks')
                  candidates = []
                  for page in paginator.paginate(StackStatusFilter=active_statuses):
                      for summary in page.get('StackSummaries', []):
                          name = summary.get('StackName', '')
                          if name.startswith(name_prefix):
                              candidates.append({'StackName': name, 'Status': summary.get('StackStatus', '')})
                  # For each candidate, check Prefix parameter AND owner tag match
                  for candidate in candidates:
                      try:
                          resp = cfn.describe_stacks(StackName=candidate['StackName'])
                          stacks = resp.get('Stacks', [])
                          if not stacks:
                              continue
                          params = {p['ParameterKey']: p.get('ParameterValue', '')
                                    for p in stacks[0].get('Parameters', [])}
                          tags = {t['Key']: t['Value']
                                  for t in stacks[0].get('Tags', [])}
                          stack_prefix = params.get('Prefix', '')
                          stack_owner = tags.get(ORCHESTRATOR_TAG_KEY, '')
                          if stack_prefix == prefix and stack_owner == ORCHESTRATOR_STACK_ID:
                              return candidate
                      except Exception:
                          continue
              except Exception:
                  pass
              return None

          def create_stack(row):
              existing = find_existing_stack(row['BucketName'], row.get('Prefix', ''))
              if existing:
                  print(f"EXISTING bucket={row['BucketName']} prefix={row.get('Prefix','')} stack={existing['StackName']} status={existing['Status']}")
                  return {
                      'StackName': existing['StackName'],
                      'Status': 'EXISTING',
                      'Error': '',
                      'BucketName': row['BucketName'],
                      'Prefix': row.get('Prefix', ''),
                      'TimeStamp': TIMESTAMP,
                      'KmsKey': row.get('KmsKey', '')
                  }

              if not check_bucket_exists(row['BucketName']):
                  print(f"SKIPPED bucket={row['BucketName']} reason=bucket_not_found")
                  return {
                      'StackName': '',
                      'Status': 'SKIPPED',
                      'Error': f"Bucket does not exist: {row['BucketName']}",
                      'BucketName': row['BucketName'],
                      'Prefix': row.get('Prefix', ''),
                      'TimeStamp': TIMESTAMP,
                      'KmsKey': row.get('KmsKey', '')
                  }

              stack_name = generate_stack_name(row['BucketName'], row.get('Prefix', ''))

              params = [
                  {'ParameterKey': 'BucketName', 'ParameterValue': row['BucketName']},
                  {'ParameterKey': 'TimeStamp', 'ParameterValue': TIMESTAMP},
                  {'ParameterKey': 'ExecutionMode', 'ParameterValue': MODE},
                  {'ParameterKey': 'StartS3BatchOperationsJobs', 'ParameterValue': START_S3_BATCH_OPS_JOBS},
              ]

              prefix = row.get('Prefix', '')
              if prefix:
                  params.append({'ParameterKey': 'Prefix', 'ParameterValue': prefix})

              kms_key = row.get('KmsKey', '')
              if kms_key:
                  params.append({'ParameterKey': 'ExistingKmsKeyIdOrArn', 'ParameterValue': kms_key})

              if SHARED_IAM_ROLE_ARN:
                  params.append({'ParameterKey': 'SharedIAMRoleArn', 'ParameterValue': SHARED_IAM_ROLE_ARN})

              # Always pass the orchestrator's LambdaExecutionRole as the LF admin role
              # so child stacks can make LF grants (via STS AssumeRole) without elevating
              # per-stack roles to LF admin. This avoids the ConcurrentModificationException
              # race and keeps the LF admin list clean regardless of how many buckets are
              # being rolled back. Works with both shared and per-stack IAM roles.
              params.append({'ParameterKey': 'LFAdminRoleArn', 'ParameterValue': LF_ADMIN_ROLE_ARN})

              workgroup_name = row.get('WorkGroupName', '')
              if workgroup_name:
                  params.append({'ParameterKey': 'SharedAthenaWorkGroupName', 'ParameterValue': workgroup_name})

              try:
                  cfn_call(cfn.create_stack,
                      StackName=stack_name,
                      TemplateURL=TEMPLATE_URL,
                      Parameters=params,
                      Capabilities=['CAPABILITY_IAM', 'CAPABILITY_NAMED_IAM'],
                      Tags=[
                          {'Key': ORCHESTRATOR_TAG_KEY, 'Value': ORCHESTRATOR_STACK_ID}
                      ]
                  )
                  print(f"CREATED bucket={row['BucketName']} stack={stack_name}")
                  return {
                      'StackName': stack_name,
                      'Status': 'CREATE_IN_PROGRESS',
                      'Error': '',
                      'BucketName': row['BucketName'],
                      'Prefix': row.get('Prefix', ''),
                      'TimeStamp': TIMESTAMP,
                      'KmsKey': kms_key
                  }
              except Exception as e:
                  print(f"CREATE_FAILED bucket={row['BucketName']} stack={stack_name} error={e}")
                  return {
                      'StackName': stack_name,
                      'Status': 'CREATE_FAILED',
                      'Error': str(e),
                      'BucketName': row['BucketName'],
                      'Prefix': row.get('Prefix', ''),
                      'TimeStamp': TIMESTAMP,
                      'KmsKey': kms_key
                  }

          def poll_stack(stack_info):
              stack_name = stack_info['StackName']
              bucket_name = stack_info.get('BucketName', stack_name)
              try:
                  resp = cfn_call(cfn.describe_stacks, StackName=stack_name)
                  stacks = resp.get('Stacks', [])
                  if not stacks:
                      stack_info['Status'] = 'NOT_FOUND'
                      stack_info['Error'] = f'Stack {stack_name} not found'
                      print(f"NOT_FOUND bucket={bucket_name} stack={stack_name}")
                      return stack_info

                  status = stacks[0]['StackStatus']
                  stack_info['Status'] = status

                  if status in ('CREATE_FAILED', 'ROLLBACK_COMPLETE', 'ROLLBACK_FAILED'):
                      reason = stacks[0].get('StackStatusReason', '')
                      stack_info['Error'] = reason
                      print(f"FAILED bucket={bucket_name} stack={stack_name} status={status} reason={reason}")
                  else:
                      stack_info['Error'] = ''
                      print(f"POLL bucket={bucket_name} stack={stack_name} status={status}")

                  return stack_info
              except Exception as e:
                  stack_info['Status'] = 'POLL_ERROR'
                  stack_info['Error'] = str(e)
                  print(f"POLL_ERROR bucket={bucket_name} stack={stack_name} error={e}")
                  return stack_info

          def delete_stack(stack_name):
              try:
                  cfn_call(cfn.delete_stack, StackName=stack_name)
                  return {'StackName': stack_name, 'Status': 'DELETE_IN_PROGRESS', 'Error': ''}
              except Exception as e:
                  return {'StackName': stack_name, 'Status': 'DELETE_FAILED', 'Error': str(e)}

          def handler(event, context):
              mode = event.get('Mode', 'create')

              if mode == 'create':
                  return create_stack(event.get('Row', {}))
              elif mode == 'poll':
                  return poll_stack(event.get('StackInfo', {}))
              elif mode == 'delete':
                  return delete_stack(event.get('StackInfo', {}).get('StackName', ''))
              else:
                  raise ValueError(f'Unknown mode: {mode}')

  ResultsWriterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/s3-rollback/${AWS::StackName}/${StackUuid}/ResultsWriterFunction"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  ResultsWriterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-results-writer"
      LoggingConfig:
        LogGroup: !Ref ResultsWriterFunctionLogGroup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Role: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, !GetAtt LambdaExecutionRole.Arn]
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
      Code:
        ZipFile: |
          import boto3
          import csv
          import io
          import json
          import os
          from datetime import datetime, timezone

          s3 = boto3.client('s3')

          RESULTS_BUCKET = os.environ['RESULTS_BUCKET']

          # CSV schema — keep in sync with the columns the test script and the
          # s3-rollback-orchestrator user-facing docs expect.
          CSV_HEADER = ['Bucket Name', 'Prefix', 'TimeStamp', 'KMS Key',
                        'Stack Name', 'Stack Status', 'Error']

          def _row_for(result):
              return [
                  result.get('BucketName', ''),
                  result.get('Prefix', ''),
                  result.get('TimeStamp', ''),
                  result.get('KmsKey', ''),
                  result.get('StackName', ''),
                  result.get('Status', ''),
                  result.get('Error', ''),
              ]

          def _read_json(bucket, key):
              """Read a JSON file from S3 and return the decoded object."""
              obj = s3.get_object(Bucket=bucket, Key=key)
              return json.loads(obj['Body'].read())

          def _collect_from_manifest(map_results):
              """
              Read the Distributed Map manifest + per-child result files and
              return a flat list of child outputs.

              The Distributed Map ResultWriter writes:
                <prefix>/manifest.json — index with keys 'ResultFiles':
                    { 'SUCCEEDED': [...], 'FAILED': [...], 'PENDING': [...] }
                  each entry is {'Key': '...', 'Size': N}
                <prefix>/SUCCEEDED_<n>.json, FAILED_<n>.json — each a JSON array
                  of objects with shape:
                    { "ExecutionArn": "...", "Input": {...}, "Output": "...", ... }
                  where Output is a JSON-encoded string of the child's final state.

              We collect every item we can: succeeded child outputs are the CSV
              rows; failed child outputs carry the error in Output or Cause ?
              we synthesise a best-effort row so nothing is silently lost.
              """
              writer_details = map_results.get('ResultWriterDetails', {})
              bucket = writer_details.get('Bucket')
              manifest_key = writer_details.get('Key')
              if not bucket or not manifest_key:
                  print(f"WARNING: No ResultWriterDetails in MapResults: {map_results}")
                  return []

              manifest = _read_json(bucket, manifest_key)
              print(f"Manifest: ProcessedItemCount={manifest.get('ProcessedItemCount')} "
                    f"FailedItemsCount={manifest.get('FailedItemsCount')}")

              result_files = manifest.get('ResultFiles', {})
              collected = []

              for status_bucket in ('SUCCEEDED', 'FAILED', 'PENDING'):
                  for entry in result_files.get(status_bucket, []):
                      file_key = entry.get('Key')
                      if not file_key:
                          continue
                      try:
                          items = _read_json(bucket, file_key)
                      except Exception as exc:
                          print(f"WARNING: Could not read {file_key}: {exc}")
                          continue
                      for item in items:
                          try:
                              output_str = item.get('Output', '')
                              if output_str:
                                  parsed = json.loads(output_str)
                              else:
                                  parsed = {}
                          except Exception:
                              parsed = {}

                          if status_bucket == 'SUCCEEDED' and parsed:
                              collected.append(parsed)
                          else:
                              # For FAILED/PENDING: synthesise a row from Input
                              # + any Cause/Error fields so the CSV reflects the
                              # failure rather than dropping the row.
                              item_input = item.get('Input', {}) or {}
                              if isinstance(item_input, str):
                                  try:
                                      item_input = json.loads(item_input)
                                  except Exception:
                                      item_input = {}
                              row = item_input.get('Row', {}) if isinstance(item_input, dict) else {}
                              cause = item.get('Cause') or item.get('Error') or ''
                              collected.append({
                                  'BucketName': row.get('BucketName', ''),
                                  'Prefix': row.get('Prefix', ''),
                                  'TimeStamp': item_input.get('TimeStamp', '') if isinstance(item_input, dict) else '',
                                  'KmsKey': row.get('KmsKey', ''),
                                  'StackName': '',
                                  'Status': status_bucket,
                                  'Error': cause or f'Child execution finished in state {status_bucket}',
                              })

              return collected

          def handler(event, context):
              # Two invocation shapes are supported:
              #   1. Distributed Map MapResults object (has 'ResultWriterDetails')
              #      — load child outputs from S3.
              #   2. Plain list of results, or {'Results': [...]}
              #      — legacy shape, used by WritePartialResults after a Map failure.
              if isinstance(event, dict) and 'ResultWriterDetails' in event:
                  results = _collect_from_manifest(event)
              elif isinstance(event, list):
                  results = event
              else:
                  results = event.get('Results', []) if isinstance(event, dict) else []

              print(f"Writing {len(results)} rows to results CSV.")

              output = io.StringIO()
              writer = csv.writer(output)
              writer.writerow(CSV_HEADER)
              for result in results:
                  writer.writerow(_row_for(result))

              timestamp = datetime.now(timezone.utc).strftime('%Y%m%d-%H%M%S-%f')
              key = f'results/orchestrator-results-{timestamp}.csv'

              s3.put_object(
                  Bucket=RESULTS_BUCKET,
                  Key=key,
                  Body=output.getvalue(),
                  ContentType='text/csv'
              )

              return {'ResultsKey': key, 'RowCount': len(results)}

  OrchestratorStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${AWS::StackName}-orchestrator"
      RoleArn: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorStepFunctionsRoleArn, !GetAtt StepFunctionsExecutionRole.Arn]
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt OrchestratorLogGroup.Arn
      DefinitionString: !Sub |
        {
          "Comment": "S3 Rollback Orchestrator",
          "StartAt": "ParseCSV",
          "States": {
            "ParseCSV": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${CsvParserFunction.Arn}",
                "Payload": {
                  "S3CsvUrl.$": "$.S3CsvUrl"
                }
              },
              "ResultSelector": {
                "Rows.$": "$.Payload"
              },
              "ResultPath": "$.ParseResult",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.ErrorInfo",
                  "Next": "ParseCSVFailed"
                }
              ],
              "Next": "MapOverRows"
            },
            "ParseCSVFailed": {
              "Type": "Fail",
              "Error": "OrchestratorExecutionFailed",
              "CausePath": "$.ErrorInfo.Cause"
            },
            "MapOverRows": {
              "Type": "Map",
              "ItemsPath": "$.ParseResult.Rows",
              "MaxConcurrency": 50,
              "ItemProcessor": {
                "ProcessorConfig": {
                  "Mode": "DISTRIBUTED",
                  "ExecutionType": "STANDARD"
                },
                "StartAt": "StaggerWait",
                "States": {
                  "StaggerWait": {
                    "Type": "Wait",
                    "SecondsPath": "$.Row.StaggerSeconds",
                    "Next": "CheckIfSkipped"
                  },
                  "CheckIfSkipped": {
                    "Type": "Choice",
                    "Choices": [
                      {
                        "And": [
                          {
                            "Variable": "$.Row.Status",
                            "IsPresent": true
                          },
                          {
                            "Variable": "$.Row.Status",
                            "StringEquals": "SKIPPED"
                          }
                        ],
                        "Next": "PassSkippedRow"
                      }
                    ],
                    "Default": "CreateStack"
                  },
                  "PassSkippedRow": {
                    "Type": "Pass",
                    "Parameters": {
                      "BucketName.$": "$.Row.BucketName",
                      "Prefix.$": "$.Row.Prefix",
                      "KmsKey.$": "$.Row.KmsKey",
                      "TimeStamp.$": "$.TimeStamp",
                      "Status.$": "$.Row.Status",
                      "Error.$": "$.Row.Error"
                    },
                    "End": true
                  },
                  "CreateStack": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${StackManagerFunction.Arn}",
                      "Payload": {
                        "Mode": "create",
                        "Row.$": "$.Row",
                        "TimeStamp.$": "$.TimeStamp",
                        "ExecutionMode.$": "$.Mode"
                      }
                    },
                    "ResultSelector": {
                      "StackInfo.$": "$.Payload"
                    },
                    "ResultPath": "$.CreateResult",
                    "Retry": [
                      {
                        "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException", "Lambda.TooManyRequestsException"],
                        "IntervalSeconds": 5,
                        "MaxAttempts": 3,
                        "BackoffRate": 2.0
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": ["States.ALL"],
                        "ResultPath": "$.ErrorInfo",
                        "Next": "CollectErrorResult"
                      }
                    ],
                    "Next": "CheckCreateResult"
                  },
                  "CheckCreateResult": {
                    "Type": "Choice",
                    "Choices": [
                      {
                        "Variable": "$.CreateResult.StackInfo.Status",
                        "StringEquals": "CREATE_IN_PROGRESS",
                        "Next": "InitPollCount"
                      }
                    ],
                    "Default": "CollectCreateResult"
                  },
                  "CollectCreateResult": {
                    "Type": "Pass",
                    "InputPath": "$.CreateResult.StackInfo",
                    "End": true
                  },
                  "CollectErrorResult": {
                    "Type": "Fail",
                    "Error": "CREATE_FAILED",
                    "CausePath": "$.ErrorInfo.Cause"
                  },
                  "InitPollCount": {
                    "Type": "Pass",
                    "Parameters": {
                      "StackInfo.$": "$.CreateResult.StackInfo",
                      "PollCount": 0
                    },
                    "Next": "WaitForStack"
                  },
                  "WaitForStack": {
                    "Type": "Wait",
                    "Seconds": 30,
                    "Next": "CheckStackStatus"
                  },
                  "CheckStackStatus": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${StackManagerFunction.Arn}",
                      "Payload": {
                        "Mode": "poll",
                        "StackInfo.$": "$.StackInfo"
                      }
                    },
                    "ResultSelector": {
                      "StackInfo.$": "$.Payload"
                    },
                    "ResultPath": "$.PollResult",
                    "Retry": [
                      {
                        "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException"],
                        "IntervalSeconds": 2,
                        "MaxAttempts": 3,
                        "BackoffRate": 2.0
                      }
                    ],
                    "Catch": [
                      {
                        "ErrorEquals": ["States.ALL"],
                        "ResultPath": "$.ErrorInfo",
                        "Next": "CollectPollErrorResult"
                      }
                    ],
                    "Next": "IncrementPollCount"
                  },
                  "CollectPollErrorResult": {
                    "Type": "Fail",
                    "Error": "POLL_ERROR",
                    "CausePath": "$.ErrorInfo.Cause"
                  },
                  "IncrementPollCount": {
                    "Type": "Pass",
                    "Parameters": {
                      "StackInfo.$": "$.PollResult.StackInfo",
                      "PollCount.$": "States.MathAdd($.PollCount, 1)"
                    },
                    "Next": "EvaluateStackStatus"
                  },
                  "EvaluateStackStatus": {
                    "Type": "Choice",
                    "Choices": [
                      {
                        "And": [
                          {
                            "Variable": "$.StackInfo.Status",
                            "StringMatches": "*IN_PROGRESS"
                          },
                          {
                            "Variable": "$.PollCount",
                            "NumericLessThan": 120
                          }
                        ],
                        "Next": "WaitForStack"
                      },
                      {
                        "Variable": "$.PollCount",
                        "NumericGreaterThanEquals": 120,
                        "Next": "DeleteTimedOutStack"
                      },
                      {
                        "Variable": "$.StackInfo.Status",
                        "StringEquals": "CREATE_COMPLETE",
                        "Next": "CollectResult"
                      },
                      {
                        "Variable": "$.StackInfo.Status",
                        "StringEquals": "EXISTING",
                        "Next": "CollectResult"
                      }
                    ],
                    "Default": "FailResult"
                  },
                  "FailResult": {
                    "Type": "Fail",
                    "ErrorPath": "$.StackInfo.Status",
                    "CausePath": "$.StackInfo.Error"
                  },
                  "DeleteTimedOutStack": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${StackManagerFunction.Arn}",
                      "Payload": {
                        "Mode": "delete",
                        "StackInfo.$": "$.StackInfo"
                      }
                    },
                    "ResultPath": "$.DeleteResult",
                    "Catch": [
                      {
                        "ErrorEquals": ["States.ALL"],
                        "ResultPath": "$.DeleteError",
                        "Next": "MarkTimeout"
                      }
                    ],
                    "Next": "MarkTimeout"
                  },
                  "MarkTimeout": {
                    "Type": "Fail",
                    "Error": "TIMEOUT",
                    "Cause": "Polling exceeded 120 iterations (~60 minutes)"
                  },
                  "CollectResult": {
                    "Type": "Pass",
                    "Parameters": {
                      "BucketName.$": "$.StackInfo.BucketName",
                      "Prefix.$": "$.StackInfo.Prefix",
                      "TimeStamp.$": "$.StackInfo.TimeStamp",
                      "KmsKey.$": "$.StackInfo.KmsKey",
                      "StackName.$": "$.StackInfo.StackName",
                      "Status.$": "$.StackInfo.Status",
                      "Error.$": "$.StackInfo.Error"
                    },
                    "End": true
                  }
                }
              },
              "ItemSelector": {
                "Row.$": "$$.Map.Item.Value",
                "TimeStamp.$": "$$.Execution.Input.TimeStamp",
                "Mode.$": "$$.Execution.Input.Mode"
              },
              "ResultWriter": {
                "Resource": "arn:aws:states:::s3:putObject",
                "Parameters": {
                  "Bucket": "${ResultsBucket}",
                  "Prefix.$": "States.Format('intermediate/{}', $$.Execution.Name)"
                }
              },
              "ResultPath": "$.MapResults",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.ErrorInfo",
                  "Next": "WritePartialResults"
                }
              ],
              "Next": "GenerateResults"
            },
            "GenerateResults": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ResultsWriterFunction.Arn}",
                "Payload.$": "$.MapResults"
              },
              "ResultSelector": {
                "ResultsKey.$": "$.Payload.ResultsKey"
              },
              "ResultPath": "$.GenerateResult",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException"],
                  "IntervalSeconds": 5,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.ErrorInfo",
                  "Next": "ExecutionFailed"
                }
              ],
              "End": true
            },
            "WritePartialResults": {
              "Type": "Pass",
              "Parameters": {
                "Error.$": "$.ErrorInfo"
              },
              "ResultPath": "$.PartialError",
              "Next": "CheckPartialResults"
            },
            "CheckPartialResults": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.MapResults",
                  "IsPresent": true,
                  "Next": "WriteAvailableResults"
                }
              ],
              "Default": "ExecutionFailed"
            },
            "WriteAvailableResults": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ResultsWriterFunction.Arn}",
                "Payload.$": "$.MapResults"
              },
              "ResultSelector": {
                "ResultsKey.$": "$.Payload.ResultsKey"
              },
              "ResultPath": "$.PartialResultsOutput",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.WriteError",
                  "Next": "ExecutionFailed"
                }
              ],
              "Next": "ExecutionFailed"
            },
            "ExecutionFailed": {
              "Type": "Fail",
              "Error": "OrchestratorExecutionFailed",
              "Cause": "The orchestrator encountered an unrecoverable error. Check CloudWatch Logs for details."
            }
          }
        }

  # ---------------------------------------------------------------------------
  # Cleanup state machine — runs on orchestrator stack deletion to remove all
  # child stacks. Uses a Distributed Map so each stack is deleted and polled
  # independently with no Lambda timeout ceiling.
  # ---------------------------------------------------------------------------

  CleanupStopExecutionsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/s3-rollback/${AWS::StackName}/${StackUuid}/CleanupStopExecutionsFunction"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  CleanupStopExecutionsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cleanup-stop-executions"
      LoggingConfig:
        LogGroup: !Ref CleanupStopExecutionsFunctionLogGroup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, !GetAtt LambdaExecutionRole.Arn]
      Code:
        ZipFile: |
          import boto3

          sfn = boto3.client('stepfunctions')

          def handler(event, context):
              state_machine_arn = event.get('StateMachineArn', '')
              stopped = []
              if state_machine_arn:
                  try:
                      paginator = sfn.get_paginator('list_executions')
                      for page in paginator.paginate(
                              stateMachineArn=state_machine_arn,
                              statusFilter='RUNNING'):
                          for ex in page.get('executions', []):
                              arn = ex['executionArn']
                              try:
                                  sfn.stop_execution(
                                      executionArn=arn,
                                      cause='Orchestrator stack deletion in progress')
                                  stopped.append(arn)
                                  print(f"Stopped: {arn}")
                              except Exception as e:
                                  print(f"Warning: could not stop {arn}: {e}")
                  except Exception as e:
                      print(f"Warning: list_executions failed: {e}")
              return {'StoppedCount': len(stopped)}

  CleanupFindStacksFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/s3-rollback/${AWS::StackName}/${StackUuid}/CleanupFindStacksFunction"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  CleanupFindStacksFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cleanup-find-stacks"
      LoggingConfig:
        LogGroup: !Ref CleanupFindStacksFunctionLogGroup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, !GetAtt LambdaExecutionRole.Arn]
      Code:
        ZipFile: |
          import boto3
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed

          cfn = boto3.client('cloudformation')
          ORCHESTRATOR_TAG_KEY = 'S3RollbackOrchestratorStackId'

          def handler(event, context):
              orchestrator_stack_id = event['OrchestratorStackId']
              search_statuses = [
                  'CREATE_IN_PROGRESS', 'CREATE_COMPLETE', 'CREATE_FAILED',
                  'UPDATE_IN_PROGRESS', 'UPDATE_COMPLETE', 'REVIEW_IN_PROGRESS',
                  'ROLLBACK_IN_PROGRESS', 'ROLLBACK_COMPLETE', 'ROLLBACK_FAILED',
                  'DELETE_FAILED',
              ]
              candidates = []
              paginator = cfn.get_paginator('list_stacks')
              for page in paginator.paginate(StackStatusFilter=search_statuses):
                  for s in page.get('StackSummaries', []):
                      name = s.get('StackName', '')
                      if name.startswith('s3-rollback-'):
                          candidates.append(name)
              print(f"Checking tags on {len(candidates)} candidate stacks...")

              def check_tag(stack_name):
                  delay = 1.0
                  for attempt in range(6):
                      try:
                          resp = cfn.describe_stacks(StackName=stack_name)
                          stacks = resp.get('Stacks', [])
                          if stacks:
                              tags = {t['Key']: t['Value']
                                      for t in stacks[0].get('Tags', [])}
                              if tags.get(ORCHESTRATOR_TAG_KEY) == orchestrator_stack_id:
                                  return stack_name
                          return None
                      except cfn.exceptions.ClientError as e:
                          code = e.response['Error']['Code']
                          if code in ('Throttling', 'RequestThrottled') and attempt < 5:
                              time.sleep(delay + attempt * 0.5)
                              delay = min(delay * 2, 30)
                              continue
                          return None
                  return None

              found = []
              with ThreadPoolExecutor(max_workers=5) as pool:
                  futures = {pool.submit(check_tag, n): n for n in candidates}
                  done = 0
                  for fut in as_completed(futures):
                      result = fut.result()
                      if result:
                          found.append(result)
                      done += 1
                      if done % 200 == 0:
                          print(f"  {done}/{len(candidates)} checked, {len(found)} found...")
              print(f"Found {len(found)} child stacks")
              return [{'StackName': name} for name in found]

  CleanupDeleteOneFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/s3-rollback/${AWS::StackName}/${StackUuid}/CleanupDeleteOneFunction"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  CleanupDeleteOneFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cleanup-delete-one"
      LoggingConfig:
        LogGroup: !Ref CleanupDeleteOneFunctionLogGroup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      MemorySize: 128
      Role: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, !GetAtt LambdaExecutionRole.Arn]
      Code:
        ZipFile: |
          import boto3
          import time
          from botocore.exceptions import ClientError

          cfn = boto3.client('cloudformation')
          THROTTLE_CODES = ('Throttling', 'RequestThrottled', 'TooManyRequestsException')

          def cfn_call(func, **kwargs):
              # Retry on throttling up to 8 attempts; raise the original ClientError
              # if every attempt is throttled so callers never receive None.
              last_exc = None
              for attempt in range(8):
                  try:
                      return func(**kwargs)
                  except ClientError as e:
                      code = e.response['Error'].get('Code', '')
                      if code not in THROTTLE_CODES:
                          raise
                      last_exc = e
                      if attempt < 7:
                          delay = min(2 ** attempt + attempt, 60)
                          print(f"Throttled ({code}), retry {attempt+1} in {delay}s")
                          time.sleep(delay)
              raise last_exc

          def handler(event, context):
              stack_name = event['StackName']
              print(f"Deleting {stack_name}")
              try:
                  cfn_call(cfn.delete_stack, StackName=stack_name)
              except ClientError as e:
                  msg = str(e)
                  if 'does not exist' not in msg and 'DELETE_IN_PROGRESS' not in msg:
                      raise
              return {'StackName': stack_name, 'Status': 'DELETE_IN_PROGRESS'}

  CleanupPollOneFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/s3-rollback/${AWS::StackName}/${StackUuid}/CleanupPollOneFunction"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  CleanupPollOneFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cleanup-poll-one"
      LoggingConfig:
        LogGroup: !Ref CleanupPollOneFunctionLogGroup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      MemorySize: 128
      Role: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, !GetAtt LambdaExecutionRole.Arn]
      Code:
        ZipFile: |
          import boto3
          import time
          from botocore.exceptions import ClientError

          cfn = boto3.client('cloudformation')
          THROTTLE_CODES = ('Throttling', 'RequestThrottled', 'TooManyRequestsException')

          def cfn_call(func, **kwargs):
              # Retry on throttling up to 8 attempts; raise the original ClientError
              # if every attempt is throttled so callers never receive None.
              last_exc = None
              for attempt in range(8):
                  try:
                      return func(**kwargs)
                  except ClientError as e:
                      code = e.response['Error'].get('Code', '')
                      if code not in THROTTLE_CODES:
                          raise
                      last_exc = e
                      if attempt < 7:
                          delay = min(2 ** attempt + attempt, 60)
                          print(f"Throttled ({code}), retry {attempt+1} in {delay}s")
                          time.sleep(delay)
              raise last_exc

          def get_failed_resources(stack_name):
              """List resources that failed to delete with their reasons."""
              failed     = {}   # logical_id -> reason
              completed  = set()
              try:
                  paginator = cfn.get_paginator('describe_stack_events')
                  for page in paginator.paginate(StackName=stack_name):
                      for event in page['StackEvents']:
                          lid    = event.get('LogicalResourceId')
                          status = event.get('ResourceStatus', '')
                          if not lid or lid == stack_name:
                              continue
                          if status == 'DELETE_COMPLETE':
                              completed.add(lid)
                          elif status == 'DELETE_FAILED' and lid not in failed:
                              failed[lid] = event.get('ResourceStatusReason', '')[:200]
              except Exception as e:
                  print(f"Warning: describe_stack_events failed for {stack_name}: {e}")
              return [{'LogicalId': lid, 'Reason': reason}
                      for lid, reason in failed.items()
                      if lid not in completed]

          def handler(event, context):
              stack_name = event['StackName']
              try:
                  resp   = cfn_call(cfn.describe_stacks, StackName=stack_name)
                  status = resp['Stacks'][0]['StackStatus']
              except ClientError as e:
                  status = 'DELETE_COMPLETE' if 'does not exist' in str(e) else 'ERROR'

              print(f"{stack_name}: {status}")
              result = {'StackName': stack_name, 'Status': status}
              if status == 'DELETE_FAILED':
                  result['FailedResources'] = get_failed_resources(stack_name)
              return result

  CleanupTriggerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/s3-rollback/${AWS::StackName}/${StackUuid}/CleanupTriggerFunction"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  CleanupTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-cleanup-trigger"
      LoggingConfig:
        LogGroup: !Ref CleanupTriggerFunctionLogGroup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      MemorySize: 128
      Role: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, !GetAtt LambdaExecutionRole.Arn]
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json
          import time

          sfn = boto3.client('stepfunctions')

          def handler(event, context):
              if event['RequestType'] != 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              try:
                  props = event['ResourceProperties']
                  resp  = sfn.start_execution(
                      stateMachineArn=props['CleanupStateMachineArn'],
                      input=json.dumps({
                          'OrchestratorStackId':         props['OrchestratorStackId'],
                          'OrchestratorStateMachineArn': props['OrchestratorStateMachineArn'],
                      })
                  )
                  execution_arn = resp['executionArn']
                  print(f"Started cleanup execution: {execution_arn}")
                  # Poll until done or Lambda deadline (leave 10s for cfnresponse)
                  deadline = context.get_remaining_time_in_millis() / 1000 - 10
                  start    = time.monotonic()
                  while time.monotonic() - start < deadline:
                      time.sleep(15)
                      desc   = sfn.describe_execution(executionArn=execution_arn)
                      status = desc['status']
                      print(f"Cleanup status: {status}")
                      if status == 'SUCCEEDED':
                          cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                           {'ExecutionArn': execution_arn})
                          return
                      elif status in ('FAILED', 'TIMED_OUT', 'ABORTED'):
                          # Surface the cleanup failure as a CFN custom resource
                          # failure so orchestrator stack deletion fails loudly.
                          # The shared IAM role is preserved (DependsOn) so the
                          # operator can retry the stack delete after fixing
                          # whatever caused the child stack to get stuck.
                          reason = (f'Cleanup state machine {status}. '
                                    f'See execution {execution_arn} for which '
                                    f'child stack(s) failed and which resources '
                                    f'are stuck.')
                          print(f"FAILED: {reason}")
                          cfnresponse.send(event, context, cfnresponse.FAILED, {},
                                           reason=reason[:1024])
                          return

                  # Lambda about to time out — abort the execution and fail loudly.
                  # We must not return SUCCESS while the cleanup is still running,
                  # because CFN would then proceed to delete the shared role and
                  # any in-flight child stack deletions would be left orphaned.
                  reason = (f'Cleanup did not complete within Lambda timeout '
                            f'(900s). Execution {execution_arn} aborted. '
                            f'Re-delete the orchestrator stack to retry, or '
                            f'check the state machine for stuck stacks.')
                  try:
                      sfn.stop_execution(executionArn=execution_arn,
                                         cause='Trigger Lambda timeout')
                  except Exception as e:
                      print(f"Warning: could not stop execution: {e}")
                  print(f"FAILED: {reason}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {},
                                   reason=reason[:1024])
              except Exception as e:
                  print(f"Error: {e}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=str(e))

  CleanupStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${AWS::StackName}-cleanup"
      RoleArn: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorStepFunctionsRoleArn, !GetAtt StepFunctionsExecutionRole.Arn]
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt CleanupLogGroup.Arn
      Definition:
        Comment: "Deletes all child stacks tagged with this orchestrator's stack ID"
        StartAt: StopOrchestratorExecutions
        States:
          StopOrchestratorExecutions:
            Type: Task
            Resource: !GetAtt CleanupStopExecutionsFunction.Arn
            Parameters:
              StateMachineArn.$: "$.OrchestratorStateMachineArn"
            ResultPath: "$.StopResult"
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 5
                MaxAttempts: 4
                BackoffRate: 2.0
            Next: FindChildStacks

          FindChildStacks:
            Type: Task
            Resource: !GetAtt CleanupFindStacksFunction.Arn
            Parameters:
              OrchestratorStackId.$: "$.OrchestratorStackId"
            ResultPath: "$.ChildStacks"
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                  - Lambda.TooManyRequestsException
                IntervalSeconds: 5
                MaxAttempts: 4
                BackoffRate: 2.0
            Next: AnyStacksToDelete

          AnyStacksToDelete:
            Type: Choice
            Choices:
              - Variable: "$.ChildStacks[0]"
                IsPresent: true
                Next: DeleteAllStacks
            Default: CleanupComplete

          DeleteAllStacks:
            Type: Map
            ItemsPath: "$.ChildStacks"
            MaxConcurrency: 50
            ItemProcessor:
              ProcessorConfig:
                Mode: DISTRIBUTED
                ExecutionType: STANDARD
              StartAt: DeleteStack
              States:
                DeleteStack:
                  Type: Task
                  Resource: !GetAtt CleanupDeleteOneFunction.Arn
                  Parameters:
                    StackName.$: "$.StackName"
                  ResultPath: "$"
                  Retry:
                    - ErrorEquals:
                        - Lambda.ServiceException
                        - Lambda.AWSLambdaException
                        - Lambda.SdkClientException
                        - Lambda.TooManyRequestsException
                      IntervalSeconds: 5
                      MaxAttempts: 6
                      BackoffRate: 2.0
                  Next: WaitForDelete

                WaitForDelete:
                  Type: Wait
                  Seconds: 30
                  Next: PollStack

                PollStack:
                  Type: Task
                  Resource: !GetAtt CleanupPollOneFunction.Arn
                  Parameters:
                    StackName.$: "$.StackName"
                  ResultPath: "$"
                  Retry:
                    - ErrorEquals:
                        - Lambda.ServiceException
                        - Lambda.AWSLambdaException
                        - Lambda.SdkClientException
                        - Lambda.TooManyRequestsException
                      IntervalSeconds: 5
                      MaxAttempts: 6
                      BackoffRate: 2.0
                  Next: CheckDeleteStatus

                CheckDeleteStatus:
                  Type: Choice
                  Choices:
                    - Variable: "$.Status"
                      StringEquals: "DELETE_COMPLETE"
                      Next: StackDeleted
                    - Variable: "$.Status"
                      StringEquals: "DELETE_FAILED"
                      Next: RetryDelete
                  Default: WaitForDelete

                RetryDelete:
                  Type: Task
                  Resource: !GetAtt CleanupDeleteOneFunction.Arn
                  Parameters:
                    StackName.$: "$.StackName"
                  ResultPath: "$"
                  Retry:
                    - ErrorEquals:
                        - Lambda.ServiceException
                        - Lambda.AWSLambdaException
                        - Lambda.SdkClientException
                        - Lambda.TooManyRequestsException
                      IntervalSeconds: 10
                      MaxAttempts: 6
                      BackoffRate: 2.0
                  Next: WaitAfterRetry

                WaitAfterRetry:
                  Type: Wait
                  Seconds: 60
                  Next: PollAfterRetry

                PollAfterRetry:
                  Type: Task
                  Resource: !GetAtt CleanupPollOneFunction.Arn
                  Parameters:
                    StackName.$: "$.StackName"
                  ResultPath: "$"
                  Retry:
                    - ErrorEquals:
                        - Lambda.ServiceException
                        - Lambda.AWSLambdaException
                        - Lambda.SdkClientException
                        - Lambda.TooManyRequestsException
                      IntervalSeconds: 5
                      MaxAttempts: 6
                      BackoffRate: 2.0
                  Next: CheckRetryStatus

                CheckRetryStatus:
                  Type: Choice
                  Choices:
                    - Variable: "$.Status"
                      StringEquals: "DELETE_COMPLETE"
                      Next: StackDeleted
                    - Variable: "$.Status"
                      StringEquals: "DELETE_FAILED"
                      Next: StackFailed
                  Default: WaitForDelete

                StackDeleted:
                  Type: Succeed

                StackFailed:
                  Type: Fail
                  ErrorPath: "$.Status"
                  CausePath: "States.JsonToString($.FailedResources)"

            ResultPath: "$.DeleteResults"
            Next: CleanupComplete

          CleanupComplete:
            Type: Succeed

  # EventBridge rules to notify via SNS when either state machine fails.
  OrchestratorFailureRule:
    Type: AWS::Events::Rule
    Condition: HasSNSEmailList
    Properties:
      Description: "Notify on orchestrator state machine execution failure"
      EventPattern:
        source:
          - aws.states
        detail-type:
          - "Step Functions Execution Status Change"
        detail:
          status:
            - FAILED
            - TIMED_OUT
            - ABORTED
          stateMachineArn:
            - !Ref OrchestratorStateMachine
      Targets:
        - Id: SNSTarget
          Arn: !Ref FailureNotificationTopic
          InputTransformer:
            InputPathsMap:
              executionArn: "$.detail.executionArn"
              status: "$.detail.status"
              startDate: "$.detail.startDate"
              stopDate: "$.detail.stopDate"
            InputTemplate: |
              "S3 Rollback Orchestrator execution <status>. Execution: <executionArn>. Started: <startDate>. Stopped: <stopDate>. Check CloudWatch Logs for details."

  CleanupFailureRule:
    Type: AWS::Events::Rule
    Condition: HasSNSEmailList
    Properties:
      Description: "Notify on cleanup state machine execution failure"
      EventPattern:
        source:
          - aws.states
        detail-type:
          - "Step Functions Execution Status Change"
        detail:
          status:
            - FAILED
            - TIMED_OUT
            - ABORTED
          stateMachineArn:
            - !Ref CleanupStateMachine
      Targets:
        - Id: SNSTarget
          Arn: !Ref FailureNotificationTopic
          InputTransformer:
            InputPathsMap:
              executionArn: "$.detail.executionArn"
              status: "$.detail.status"
              startDate: "$.detail.startDate"
              stopDate: "$.detail.stopDate"
            InputTemplate: |
              "S3 Rollback Cleanup execution <status>. Execution: <executionArn>. Started: <startDate>. Stopped: <stopDate>. Check CloudWatch Logs for details."

  # Allow EventBridge to publish to the SNS topic
  FailureTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasSNSEmailList
    Properties:
      Topics:
        - !Ref FailureNotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: "sns:Publish"
            Resource: !Ref FailureNotificationTopic

  AutoStartFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
        - "/aws/lambda/s3-rollback/${AWS::StackName}/${StackUuid}/AutoStartFunction"
        - StackUuid: !Select [2, !Split ["/", !Ref "AWS::StackId"]]

  AutoStartFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-auto-start"
      LoggingConfig:
        LogGroup: !Ref AutoStartFunctionLogGroup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !If [UseSuppliedOrchestratorRoles, !Ref OrchestratorLambdaRoleArn, !GetAtt LambdaExecutionRole.Arn]
      Code:
        ZipFile: |
          import boto3
          import json
          import cfnresponse

          sfn = boto3.client('stepfunctions')

          # Properties that only order this resource against others. A change to them alone
          # (for example LFAdminGate appearing when an older stack is updated) must not
          # start a new run.
          ORDERING_ONLY = ('ServiceToken', 'LFAdminGate')

          def run_inputs(props):
              return {k: v for k, v in (props or {}).items() if k not in ORDERING_ONLY}

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              if (event['RequestType'] == 'Update'
                      and run_inputs(event.get('OldResourceProperties')) == run_inputs(event['ResourceProperties'])):
                  print("Only ordering properties changed; not starting a new execution.")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              try:
                  state_machine_arn = event['ResourceProperties']['StateMachineArn']
                  execution_input = event['ResourceProperties']['ExecutionInput']

                  resp = sfn.start_execution(
                      stateMachineArn=state_machine_arn,
                      input=json.dumps(execution_input)
                  )

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'ExecutionArn': resp['executionArn']
                  })
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=str(e))

  ChildStackCleanupTrigger:
    Type: Custom::ChildStackCleanup
    Condition: ShouldCreateSharedRole
    # DependsOn: ChildStackExecutionRole forces CFN to keep the shared role
    # alive until the trigger completes. Combined with the trigger polling
    # the cleanup state machine to completion, this guarantees the shared
    # role is available for every child stack's custom resource Lambdas
    # during cleanup. Without this, CFN could delete the shared role in
    # parallel with the trigger, causing child stack DELETE_FAILED.
    # OrchestratorLFAdmin must also outlive the trigger: child stacks revoke their
    # LF grants on deletion by assuming LambdaExecutionRole, which needs to still
    # be a data lake admin at that point. OrchestratorLFAdmin is conditional, and
    # DependsOn cannot name a resource whose condition is false, so the dependency
    # comes from the LFAdminGate property reference instead (same on all four
    # resources that must wait for it).
    DependsOn:
      - CleanupStateMachine
      - OrchestratorStateMachine
      - ChildStackExecutionRole
    Properties:
      ServiceToken: !GetAtt CleanupTriggerFunction.Arn
      LFAdminGate: !If [CreateOrchestratorRoles, !Ref OrchestratorLFAdmin, !Ref "AWS::NoValue"]
      OrchestratorStackId: !Ref AWS::StackId
      OrchestratorStateMachineArn: !Ref OrchestratorStateMachine
      CleanupStateMachineArn: !Ref CleanupStateMachine

  ChildStackCleanupTriggerNoSharedRole:
    Type: Custom::ChildStackCleanup
    Condition: ShouldNotCreateSharedRole
    DependsOn:
      - CleanupStateMachine
      - OrchestratorStateMachine
    Properties:
      ServiceToken: !GetAtt CleanupTriggerFunction.Arn
      LFAdminGate: !If [CreateOrchestratorRoles, !Ref OrchestratorLFAdmin, !Ref "AWS::NoValue"]
      OrchestratorStackId: !Ref AWS::StackId
      OrchestratorStateMachineArn: !Ref OrchestratorStateMachine
      CleanupStateMachineArn: !Ref CleanupStateMachine

  AutoStartExecution:
    Type: Custom::AutoStartStateMachine
    Condition: HasSNSEmailList
    DependsOn:
      - OrchestratorStateMachine
      - OrchestratorFailureRule
    Properties:
      ServiceToken: !GetAtt AutoStartFunction.Arn
      LFAdminGate: !If [CreateOrchestratorRoles, !Ref OrchestratorLFAdmin, !Ref "AWS::NoValue"]
      StateMachineArn: !Ref OrchestratorStateMachine
      ExecutionInput:
        S3CsvUrl: !Ref S3CsvUrl
        ResultsBucket: !Ref ResultsBucket
        StartS3BatchOperationsJobs: !Ref StartS3BatchOperationsJobs
        TimeStamp: !Ref TimeStamp
        Mode: !Ref Mode

  AutoStartExecutionNoSNS:
    Type: Custom::AutoStartStateMachine
    Condition: HasNoSNSEmailList
    DependsOn:
      - OrchestratorStateMachine
    Properties:
      ServiceToken: !GetAtt AutoStartFunction.Arn
      LFAdminGate: !If [CreateOrchestratorRoles, !Ref OrchestratorLFAdmin, !Ref "AWS::NoValue"]
      StateMachineArn: !Ref OrchestratorStateMachine
      ExecutionInput:
        S3CsvUrl: !Ref S3CsvUrl
        ResultsBucket: !Ref ResultsBucket
        StartS3BatchOperationsJobs: !Ref StartS3BatchOperationsJobs
        TimeStamp: !Ref TimeStamp
        Mode: !Ref Mode

Outputs:
  StateMachineArn:
    Description: ARN of the orchestrator Step Functions state machine
    Value: !Ref OrchestratorStateMachine

  CleanupStateMachineArn:
    Description: ARN of the cleanup Step Functions state machine
    Value: !Ref CleanupStateMachine

  ChildStackExecutionRoleArn:
    Condition: ShouldCreateSharedRole
    Description: ARN of the shared IAM role created for child stack Lambdas
    Value: !GetAtt ChildStackExecutionRole.Arn
