[package]
name = "s3-rollback-delete-function"
version = "1.0.0"
edition = "2021"
license = "MIT-0"
publish = false
description = "Optional Rust build of S3BatchOpsDeleteFunction from s3-rollback.yaml and s3-rollback-glue-metadata.yaml"

[dependencies]
aws-config = "1.13.0"
aws-sdk-s3 = "1.156.0"
lambda_runtime = "1.5.0"
percent-encoding = "2.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
